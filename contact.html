<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — Unique Vacations India</title>

    <meta name="description"
        content="Contact Unique Vacations India for domestic and international tour enquiries, custom packages and travel planning.">

    <meta name="theme-color" content="#0a1628">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <link rel="icon" href="images/logo.png" type="image/png">
</head>


<body>

    <canvas id="hero-canvas" aria-hidden="true"></canvas>

    <div class="site-wrap">

        <!-- HEADER -->
        <div id="site-header"></div>


        <main>

            <!-- PAGE HERO -->
            <div class="page-hero">

                <div class="container">

                    <h1>Contact Us</h1>

                    <p>
                        We respond within 24 hours — let's plan your perfect vacation
                    </p>

                </div>

            </div>


            <!-- CONTACT SECTION -->
            <section class="section">

                <div class="container">

                    <div class="grid-2">


                        <!-- ==========================================
                             GET IN TOUCH
                        =========================================== -->

                        <div class="glass glass-card reveal">

                            <h3 style="
                                font-family:var(--font-heading);
                                margin-bottom:16px;
                                color:var(--accent-light);
                            ">
                                Get in Touch
                            </h3>


                            <p style="
                                color:var(--muted);
                                margin-bottom:12px;
                            ">
                                <strong>Phone:</strong>
                                +91 9785942039
                            </p>


                            <p style="
                                color:var(--muted);
                                margin-bottom:12px;
                            ">
                                <strong>Email:</strong>
                                info@uniquevacations.in
                            </p>


                            <p style="
                                color:var(--muted);
                                margin-bottom:12px;
                            ">
                                <strong>Website:</strong>
                                uniquevacations.in
                            </p>


                            <p style="
                                color:var(--muted);
                                margin-bottom:20px;
                            ">
                                <strong>Hours:</strong>
                                Mon–Sat, 9 AM – 7 PM IST
                            </p>


                            <!-- BUTTONS -->

                            <div class="cta-row">

                                <!-- WHATSAPP -->

                                <a
                                    href="https://wa.me/919785942039?text=Hello%20Unique%20Vacations%20India%2C%0A%0AI%20am%20interested%20in%20your%20travel%20packages.%0A%0APlease%20share%20available%20destinations%2C%20packages%20and%20pricing.%0A%0AThank%20you."
                                    class="btn btn-accent"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    WhatsApp
                                </a>


                                <!-- EMAIL -->

                                <a
                                    href="mailto:info@uniquevacations.in?subject=Travel%20Enquiry%20-%20Unique%20Vacations"
                                    class="btn btn-outline"
                                >
                                    Email
                                </a>

                            </div>

                        </div>



                        <!-- ==========================================
                             ENQUIRY FORM
                        =========================================== -->

                        <form
                            class="glass glass-card reveal"
                            id="enquiryForm"
                            data-contact
                        >

                            <h3 style="
                                font-family:var(--font-heading);
                                margin-bottom:20px;
                            ">
                                Send an Enquiry
                            </h3>



                            <!-- FULL NAME -->

                            <div class="form-group">

                                <label for="fullName">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    required
                                    placeholder="Your name"
                                >

                            </div>



                            <!-- EMAIL -->

                            <div class="form-group">

                                <label for="email">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    required
                                    placeholder="you@email.com"
                                >

                            </div>



                            <!-- PHONE -->

                            <div class="form-group">

                                <label for="phone">
                                    Phone
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    required
                                    placeholder="+91..."
                                >

                            </div>



                            <!-- =====================================
                                 TRAVEL TYPE
                            ====================================== -->

                            <div class="form-group">

                                <label for="travelType">
                                    Destination Interest
                                </label>

                                <select
                                    id="travelType"
                                    name="travelType"
                                    required
                                >

                                    <option value="">
                                        Select Destination Type
                                    </option>

                                    <option value="Domestic">
                                        Domestic
                                    </option>

                                    <option value="International">
                                        International
                                    </option>

                                </select>

                            </div>



                            <!-- =====================================
                                 DESTINATION
                            ====================================== -->

                            <div
                                class="form-group"
                                id="destinationGroup"
                                style="display:none;"
                            >

                                <label for="destination">
                                    Select Destination
                                </label>

                                <select
                                    id="destination"
                                    name="destination"
                                    required
                                >

                                    <option value="">
                                        Select a destination
                                    </option>

                                </select>

                            </div>



                            <!-- TRAVEL DATES -->

                            <div class="form-group">

                                <label for="travelDates">
                                    Travel Dates
                                </label>

                                <input
                                    type="text"
                                    id="travelDates"
                                    name="travelDates"
                                    placeholder="e.g. March 2027, flexible"
                                >

                            </div>



                            <!-- NUMBER OF TRAVELERS -->

                            <div class="form-group">

                                <label for="travelers">
                                    Number of Travelers
                                </label>

                                <input
                                    type="number"
                                    id="travelers"
                                    name="travelers"
                                    min="1"
                                    placeholder="2"
                                >

                            </div>



                            <!-- MESSAGE -->

                            <div class="form-group">

                                <label for="message">
                                    Message
                                </label>

                                <textarea
                                    id="message"
                                    name="message"
                                    placeholder="Tell us about your dream trip..."
                                ></textarea>

                            </div>



                            <!-- SUBMIT -->

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Send Enquiry on WhatsApp
                            </button>

                        </form>

                    </div>

                </div>

            </section>

        </main>


        <!-- FOOTER -->

        <div id="site-footer"></div>

    </div>



    <!-- ==========================================
         DESTINATION + WHATSAPP SCRIPT
    =========================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {


            /* ==========================================
               ELEMENTS
            =========================================== */

            const travelType =
                document.getElementById("travelType");

            const destinationGroup =
                document.getElementById("destinationGroup");

            const destination =
                document.getElementById("destination");

            const enquiryForm =
                document.getElementById("enquiryForm");


            /* ==========================================
               DOMESTIC DESTINATIONS
            =========================================== */

            const domesticDestinations = [

                "Goa",

                "Kerala",

                "Rajasthan",

                "Ladakh",

                "Kashmir",

                "Himachal Pradesh",

                "Andaman & Nicobar",

                "Uttarakhand",

                "Uttar Pradesh",

                "Varanasi",

                "Agra",

                "Jaipur",

                "Jodhpur",

                "Udaipur",

                "Jaisalmer",

                "Delhi",

                "Mumbai",

                "Manali",

                "Shimla",

                "Dharamshala",

                "Rishikesh",

                "Haridwar",

                "Amritsar",

                "Sikkim",

                "Darjeeling",

                "North East India",

                "Madhya Pradesh",

                "Gujarat",

                "Maharashtra",

                "Tamil Nadu",

                "Karnataka",

                "Andhra Pradesh",

                "Odisha",

                "Pondicherry",

                "Lakshadweep",

                "Golden Triangle",

                "Custom / Multiple"

            ];



            /* ==========================================
               INTERNATIONAL DESTINATIONS
            =========================================== */

            const internationalDestinations = [

                "Dubai",

                "Abu Dhabi",

                "Sharjah",

                "Singapore",

                "Malaysia",

                "Bali",

                "Indonesia",

                "Thailand",

                "Phuket",

                "Bangkok",

                "Maldives",

                "Sri Lanka",

                "Mauritius",

                "Seychelles",

                "Vietnam",

                "Cambodia",

                "Hong Kong",

                "Macau",

                "Japan",

                "South Korea",

                "Australia",

                "New Zealand",

                "Europe",

                "France",

                "Paris",

                "Italy",

                "Switzerland",

                "Germany",

                "Netherlands",

                "Spain",

                "Greece",

                "United Kingdom",

                "London",

                "Turkey",

                "Egypt",

                "South Africa",

                "USA",

                "Canada",

                "Mexico",

                "Brazil",

                "Saudi Arabia",

                "Qatar",

                "Oman",

                "Jordan",

                "Georgia",

                "Azerbaijan",

                "Armenia",

                "Uzbekistan",

                "International Custom / Multiple"

            ];



            /* ==========================================
               UPDATE DESTINATION DROPDOWN
            =========================================== */

            travelType.addEventListener("change", function () {

                const selectedType = this.value;


                /* Clear old destinations */

                destination.innerHTML =
                    '<option value="">Select a destination</option>';


                /* No type selected */

                if (!selectedType) {

                    destinationGroup.style.display = "none";

                    destination.required = false;

                    return;

                }


                /* Show destination field */

                destinationGroup.style.display = "block";

                destination.required = true;


                let destinations = [];


                /* Domestic */

                if (selectedType === "Domestic") {

                    destinations = domesticDestinations;

                }


                /* International */

                if (selectedType === "International") {

                    destinations = internationalDestinations;

                }


                /* Add destinations */

                destinations.forEach(function (place) {

                    const option =
                        document.createElement("option");

                    option.value = place;

                    option.textContent = place;

                    destination.appendChild(option);

                });

            });



            /* ==========================================
               FORM SUBMIT
            =========================================== */

            enquiryForm.addEventListener("submit", function (event) {

                event.preventDefault();


                /* ==========================================
                   GET FORM VALUES
                =========================================== */

                const name =
                    document.getElementById("fullName")
                    .value
                    .trim();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();


                const phone =
                    document.getElementById("phone")
                    .value
                    .trim();


                const type =
                    document.getElementById("travelType")
                    .value;


                const selectedDestination =
                    document.getElementById("destination")
                    .value;


                const travelDates =
                    document.getElementById("travelDates")
                    .value
                    .trim();


                const travelers =
                    document.getElementById("travelers")
                    .value
                    .trim();


                const message =
                    document.getElementById("message")
                    .value
                    .trim();



                /* ==========================================
                   VALIDATION
                =========================================== */

                if (
                    !name ||
                    !email ||
                    !phone ||
                    !type ||
                    !selectedDestination
                ) {

                    alert(
                        "Please fill in all required fields."
                    );

                    return;

                }



                /* ==========================================
                   WHATSAPP MESSAGE
                =========================================== */

                const whatsappMessage =

`Hello Unique Vacations India,

I would like to enquire about a travel package.

*Customer Details*

Name: ${name}
Email: ${email}
Phone: ${phone}

*Trip Details*

Travel Type: ${type}
Destination: ${selectedDestination}
Travel Dates: ${travelDates || "Not specified"}
Number of Travelers: ${travelers || "Not specified"}

*Message*

${message || "I would like to know more about the available travel packages, pricing and itinerary."}

Thank you.
`;



                /* ==========================================
                   WHATSAPP NUMBER
                =========================================== */

                const whatsappNumber =
                    "919785942039";



                /* ==========================================
                   CREATE WHATSAPP URL
                =========================================== */

                const encodedMessage =
                    encodeURIComponent(
                        whatsappMessage
                    );


                const whatsappURL =
                    `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;



                /* ==========================================
                   OPEN WHATSAPP
                =========================================== */

                window.open(
                    whatsappURL,
                    "_blank",
                    "noopener,noreferrer"
                );

            });

        });

    </script>



    <!-- MAIN JS -->

    <script src="js/main.js"></script>

</body>

</html>
